workflows:
  android-workflow:
    name: Miruji Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - miruji_keystore
      java: 21
      vars:
        PACKAGE_NAME: "com.miruji.app"
      node: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add Android platform (first run only, skips if exists)
        script: |
          test -d android || npx cap add android
      - name: Generate app icons and splash
        script: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#000000'
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Set up Firebase Cloud Messaging
        script: |
          # google-services.json is injected from a Codemagic env var (base64),
          # never committed. @capacitor/push-notifications needs it for Android.
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON env var is not set" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

          python3 - <<'PYEOF'
          # project build.gradle: ensure the google-services classpath is present
          p = "android/build.gradle"
          s = open(p).read()
          if "com.google.gms:google-services" not in s:
              s = s.replace(
                  "dependencies {",
                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1,
              )
          else:
              s = s.replace("// classpath 'com.google.gms:google-services", "classpath 'com.google.gms:google-services")
          open(p, "w").write(s)

          # app build.gradle: apply the plugin (Capacitor ships it commented out)
          p = "android/app/build.gradle"
          s = open(p).read()
          if "apply plugin: 'com.google.gms.google-services'" not in s:
              if "// apply plugin: 'com.google.gms.google-services'" in s:
                  s = s.replace("// apply plugin: 'com.google.gms.google-services'", "apply plugin: 'com.google.gms.google-services'")
              else:
                  s = s.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n"
              open(p, "w").write(s)
          print("FCM gradle wiring done")
          PYEOF
      - name: Configure Android signing and version
        script: |
          export VERSION_NAME=$(node -p "require('./package.json').version")
          cd android/app
          python3 - <<'PYEOF'
          import os
          import re

          with open("build.gradle") as f:
              content = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
          '''

          content = content.replace("    buildTypes {", signing_block + "    buildTypes {", 1)
          content = content.replace(
              "        release {\n            minifyEnabled false",
              "        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",
              1
          )

          # versionCode = CI build number (monotonic, required unique by Play);
          # versionName = package.json "version" (single source of truth).
          build_number = os.environ.get("BUILD_NUMBER", "1")
          version_name = os.environ.get("VERSION_NAME", "1.0.0")
          content = re.sub(r"versionCode\s+\d+", "versionCode " + build_number, content, count=1)
          content = re.sub(r'versionName\s+"[^"]*"', 'versionName "%s"' % version_name, content, count=1)

          with open("build.gradle", "w") as f:
              f.write(content)

          print("Android versionCode=%s versionName=%s" % (build_number, version_name))
          PYEOF
      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease
      - name: Build apk for direct install
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - iamborghini5757@gmail.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: Miruji iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Miruji
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.miruji.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add iOS platform (first run only, skips if exists)
        script: |
          test -d ios || npx cap add ios
      - name: CocoaPods install
        script: |
          cd ios/App && pod install
      - name: Generate app icons
        script: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#000000'
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Configure iOS project (iPhone only, export compliance)
        script: |
          # The ios/ project is regenerated by `npx cap add ios` on every build,
          # so these two edits must be re-applied here each time.

          # iPhone only: drop iPad (and thus Apple Watch companion) from the
          # device family. Capacitor's template sets "1,2" in both Debug and
          # Release build configs.
          python3 - <<'PYEOF'
          p = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(p).read()
          n = s.count('TARGETED_DEVICE_FAMILY = "1,2";')
          s = s.replace('TARGETED_DEVICE_FAMILY = "1,2";', 'TARGETED_DEVICE_FAMILY = "1";')
          open(p, "w").write(s)
          print("TARGETED_DEVICE_FAMILY: %d entr%s set to \"1\"" % (n, "y" if n == 1 else "ies"))
          PYEOF

          # Export compliance: app uses no non-exempt encryption, so App Store
          # Connect stops asking on every upload.
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST"
      - name: Configure push notifications (iOS)
        script: |
          # ios/ is regenerated every build, so re-apply the push setup here.
          python3 - <<'PYEOF'
          # 1) aps-environment entitlement
          open("ios/App/App/App.entitlements", "w").write(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
              '<plist version="1.0">\n<dict>\n\t<key>aps-environment</key>\n\t<string>production</string>\n</dict>\n</plist>\n'
          )

          # 2) point the App target at the entitlements file (Debug + Release)
          pbx = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(pbx).read()
          if "CODE_SIGN_ENTITLEMENTS" not in s:
              n = s.count("PRODUCT_BUNDLE_IDENTIFIER = com.miruji.app;")
              s = s.replace(
                  "PRODUCT_BUNDLE_IDENTIFIER = com.miruji.app;",
                  "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = com.miruji.app;",
              )
              open(pbx, "w").write(s)
              print("entitlements wired into %d build config(s)" % n)
          else:
              print("CODE_SIGN_ENTITLEMENTS already present")

          # 3) forward APNs callbacks to Capacitor from AppDelegate
          appd = "ios/App/App/AppDelegate.swift"
          s = open(appd).read()
          if "capacitorDidRegisterForRemoteNotifications" not in s:
              hook = (
                  "\n"
                  "    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n"
                  "        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n"
                  "    }\n\n"
                  "    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n"
                  "        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n"
                  "    }\n"
              )
              idx = s.rfind("}")
              s = s[:idx] + hook + "}\n"
              open(appd, "w").write(s)
              print("AppDelegate push hooks added")
          else:
              print("AppDelegate push hooks already present")
          PYEOF
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Set version and build number
        script: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
          agvtool new-marketing-version "$VERSION_NAME"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - iamborghini5757@gmail.com
        notify:
          success: true
          failure: true
