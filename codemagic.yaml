workflows:
  generate-keystore:
    name: Generate Android Keystore (one-time use)
    max_build_duration: 10
    instance_type: mac_mini_m2
    scripts:
      - name: Generate keystore
        script: |
          keytool -genkey -v -keystore miruji.keystore -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias miruji -dname "CN=Miruji, OU=Dev, O=Miruji, L=Seoul, ST=Seoul, C=KR" \
            -storepass "!12345678" -keypass "!12345678"
    artifacts:
      - miruji.keystore

  android-workflow:
    name: Miruji Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - miruji_keystore
      vars:
        PACKAGE_NAME: "com.miruji.app"
      node: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add Android platform (first run only, skips if exists)
        script: |
          test -d android || npx cap add android
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - iamborghini5757@gmail.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: Miruji iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.miruji.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add iOS platform (first run only, skips if exists)
        script: |
          test -d ios || npx cap add ios
      - name: CocoaPods install
        script: |
          cd ios/App && pod install
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          cd ios/App
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - iamborghini5757@gmail.com
        notify:
          success: true
          failure: true
